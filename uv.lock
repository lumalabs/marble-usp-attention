[[package]]
name = "usp-attention"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "flash-attn-4", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
    { name = "nvidia-cutlass-dsl", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
    { name = "quack-kernels", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
    { name = "torch", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]

[package.optional-dependencies]
convergence = [
    { name = "huggingface-hub", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
    { name = "pyarrow", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
    { name = "tiktoken", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]
nccl4py = [
    { name = "nccl4py", extra = ["cu12"], marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
    { name = "ruff", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]

[package.metadata]
requires-dist = [
    { name = "flash-attn-4", specifier = "==4.0.0b34" },
    { name = "huggingface-hub", marker = "extra == 'convergence'", specifier = ">=0.30" },
    { name = "nccl4py", extras = ["cu12"], marker = "extra == 'nccl4py'", specifier = "==0.2.0" },
    { name = "nvidia-cutlass-dsl", specifier = ">=4.7.0,<4.8" },
    { name = "pyarrow", marker = "extra == 'convergence'", specifier = ">=18" },
    { name = "quack-kernels", specifier = ">=0.6.5,<0.7" },
    { name = "tiktoken", marker = "extra == 'convergence'", specifier = ">=0.9" },
    { name = "torch", marker = "sys_platform != 'linux'", specifier = ">=2.11.0,<2.12.0" },
    { name = "torch", marker = "sys_platform == 'linux'", specifier = ">=2.11.0,<2.12.0", index = "https://download.pytorch.org/whl/cu129" },
]
provides-extras = ["nccl4py", "convergence"]

[package.metadata.requires-dev]
dev = [
    { name = "pytest", specifier = ">=8.2.0" },
    { name = "ruff", specifier = "==0.14.14" },
]
