version = 1

# Documentation, configuration and benchmark data.
[[annotations]]
path = [
    "**/*.md",
    "**/.gitignore",
    ".python-version",
    "pyproject.toml",
    "ruff.toml",
    "uv.lock",
    "REUSE.toml",
    "CITATION.cff",
    "benchmarks/results/**",
    "benchmarks/baselines/flashmask_runs/lists/**",
    "benchmarks/layouts/**",
    "repro/layouts/*.json",
    "repro/validation/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Luma AI, Inc."
SPDX-License-Identifier = "MIT"

# Vendored unmodified-header file; its copyright notice stays in the file.
[[annotations]]
path = "src/usp_attention/online_flash_amd/csrc/opus.hpp"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 carlus.huang@amd.com"
SPDX-License-Identifier = "MIT"

