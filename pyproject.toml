[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "usp-attention"
version = "0.1.0"
description = "Ulysses x ring context parallelism for packed sparse attention on FlashAttention-4"
readme = "README.md"
license = "MIT AND BSD-3-Clause AND Apache-2.0"
license-files = ["LICENSE", "LICENSES/*", "third_party_licenses/*", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.11.0,<2.12.0",
    # Exact FA4 pin: the ring kernels call FA4's private _flash_attn_fwd/_bwd
    # and the online kernel subclasses FA4's SM90 forward. CuTe DSL >= 4.7 is
    # required by FA4's Blackwell backward (4.6.x deadlocks).
    "flash-attn-4==4.0.0b34",
    "nvidia-cutlass-dsl>=4.7.0,<4.8",
    "quack-kernels>=0.6.5,<0.7",
]

[project.optional-dependencies]
# One-sided RMA ring transport (cross-node); needs an NCCL >= 2.29.7 runtime.
nccl4py = ["nccl4py[cu12]==0.2.0"]
# benchmarks/convergence.py data preparation.
convergence = ["tiktoken>=0.9", "pyarrow>=18", "huggingface-hub>=0.30"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff==0.14.14",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU",
    "benchmark: timing benchmark, opt-in",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch_cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch_cu129", marker = "sys_platform == 'linux'" }
